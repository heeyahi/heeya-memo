<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>희야랜드 모바일 미리보기</title>
<style>
  body{margin:0;background:#EFE9EC;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:18px;min-height:100vh}
  .phone{display:flex;flex-direction:column;gap:8px;align-items:center}
  .cap{font-size:12px;color:#8C7A85;font-weight:700}
  iframe{width:390px;height:844px;border:0;border-radius:30px;box-shadow:0 18px 40px rgba(90,60,80,.22);background:#FFF9F5}
</style></head>
<body>
  <div class="phone"><span class="cap">iPhone 390 × 844</span><iframe id="ph" src="./index.html#home" title="모바일 미리보기"></iframe></div>
  <script>
    var p=new URLSearchParams(location.search), t=p.get('tab')||'home';
    document.getElementById('ph').src='./index.html?v='+Date.now()+'#'+t;
  </script>
</body>
</html>
