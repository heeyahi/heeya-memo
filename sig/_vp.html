<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>시그표 뷰포트 확인용 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e17}
  body{display:flex;gap:12px;align-items:flex-start;padding:8px;font:11px/1.4 sans-serif;color:#cbd5e1}
  figure{margin:0}
  figcaption{padding:2px 0 4px;color:#9fb0c8}
  .ph{position:relative;width:360px;height:480px;background:
      radial-gradient(60% 40% at 20% 15%,rgba(96,132,255,.55),transparent 70%),
      radial-gradient(50% 40% at 85% 25%,rgba(255,80,168,.38),transparent 70%),
      linear-gradient(160deg,#141b2c,#2b4472 50%,#101726)}
  .ph.tall{height:900px}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .edge{position:absolute;left:0;right:0;bottom:0;height:2px;background:#00e5a0;opacity:.85}
</style></head>
<body>
<figure>
  <figcaption>360 × 480 (프릭샷 기본)</figcaption>
  <div class="ph"><iframe src="https://heeyahi.github.io/heeya-memo/sig/?cb=vpA"></iframe><div class="edge"></div></div>
</figure>
<figure>
  <figcaption>360 × 900 (세로로 길게)</figcaption>
  <div class="ph tall"><iframe src="https://heeyahi.github.io/heeya-memo/sig/?cb=vpB"></iframe><div class="edge"></div></div>
</figure>
</body></html>
