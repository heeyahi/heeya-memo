button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;touch-action:manipulation}
input::placeholder,textarea::placeholder{color:var(--sub);opacity:.85}
img{display:block;max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--accent-soft);color:var(--ink)}

#app{
  position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100dvh);
  display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(130% 55% at 50% -8%, var(--bg-top) 0%, rgba(253,248,236,0) 62%),
    var(--bg);
}
html[data-theme="dark"] #app{
  background:radial-gradient(130% 55% at 50% -8%, var(--bg-top) 0%, rgba(20,17,14,0) 62%),var(--bg);
}
#app::before{
  content:"";position:absolute;left:0;right:0;top:0;height:300px;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(to right, rgba(140,115,84,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(140,115,84,.055) 1px, transparent 1px);
  background-size:30px 30px;
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
}

/* ---------- 상단 ---------- */
.topbar{
  position:relative;z-index:4;display:flex;align-items:center;gap:8px;
  padding:calc(9px + env(safe-area-inset-top)) 12px 6px;
}
.iconbtn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  color:var(--ink-2);transition:background .16s,transform .16s;
}
.iconbtn:active{transform:scale(.92);background:var(--line)}
.iconbtn.sm{width:32px;height:32px;border-radius:10px}
.brand{flex:1;display:flex;align-items:center;gap:9px;justify-content:center;min-width:0}
.avatar{
  width:27px;height:27px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;
  background:linear-gradient(145deg,#8B5A34,#6B4126);
  box-shadow:inset 0 1px 0 rgba(255,235,205,.35),0 2px 6px rgba(80,50,25,.28);
}
.brand h1{
  margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.035em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- 폴더 칩 ---------- */
.chips{
  position:relative;z-index:4;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
  padding:4px 14px 11px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  transition:opacity .2s, max-height .2s;
}
.chips::-webkit-scrollbar{display:none}
.chips.off{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  height:32px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,253,247,.72);
  color:var(--ink-2);font-size:13px;font-weight:600;letter-spacing:-.02em;
  white-space:nowrap;transition:all .16s;backdrop-filter:blur(6px);
}
html[data-theme="dark"] .chip{background:rgba(34,28,22,.7)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--chip-on-bg);border-color:transparent;color:var(--chip-on-ink);box-shadow:0 4px 12px rgba(110,66,34,.24)}
.chip .ci{font-size:13px;line-height:1}
.chip.add{border-style:dashed;color:var(--sub);padding:0 11px}

/* ---------- 뷰 ---------- */
.views{position:relative;flex:1;min-height:0;z-index:1}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scroll-behavior:smooth;
}
.pad{padding:2px 16px 22px;max-width:760px;margin:0 auto;width:100%}

/* ---------- 채팅 ---------- */
.chat{display:flex;flex-direction:column;gap:3px;padding-top:6px}
.date-div{
  display:flex;align-items:center;gap:10px;margin:20px 2px 12px;color:var(--sub);
  font-size:11.5px;font-weight:600;letter-spacing:-.01em;
}
.date-div::before,.date-div::after{content:"";flex:1;height:1px;background:var(--line)}
.date-div span{white-space:nowrap;padding:0 2px}
.date-div em{font-style:normal;color:var(--accent);margin-left:4px}
.sec-label{
  display:flex;align-items:center;gap:6px;margin:6px 2px 8px;
  font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.01em;
}
.row{display:flex;margin:2px 0}
.bubble{
  position:relative;max-width:84%;background:var(--bubble);
  border:1px solid var(--line);border-radius:19px;border-bottom-left-radius:7px;
  padding:11px 13px 8px;box-shadow:var(--shadow-sm);
  transition:transform .12s, background .15s;cursor:pointer;min-width:0;
  -webkit-touch-callout:none;
}
.bubble:active{transform:scale(.985)}
.bubble.pinned{border-color:rgba(176,114,63,.32);background:linear-gradient(180deg,rgba(244,227,200,.5),var(--bubble) 60%)}
html[data-theme="dark"] .bubble.pinned{background:linear-gradient(180deg,rgba(58,43,30,.85),var(--bubble) 60%)}
.bubble.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{0%{transform:translateY(10px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.bubble.flash{animation:flash 1.5s ease}
@keyframes flash{0%,42%{box-shadow:0 0 0 2px var(--accent),0 8px 22px rgba(176,114,63,.28)}100%{box-shadow:var(--shadow-sm)}}
.b-title{font-size:14px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px;word-break:break-word}
.b-text{
  font-size:15px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;
}
.b-imgs{display:grid;gap:3px;margin-bottom:7px;border-radius:13px;overflow:hidden}
.b-imgs.n1{grid-template-columns:1fr}
.b-imgs.n2{grid-template-columns:1fr 1fr}
.b-imgs.n3,.b-imgs.n4,.b-imgs.nx{grid-template-columns:repeat(3,1fr)}
.b-imgs img{width:100%;object-fit:cover;border-radius:11px;background:var(--surface-2)}
.b-imgs.n1 img{max-height:280px;width:auto;max-width:100%;margin:0 auto}
.b-imgs.n2 img{aspect-ratio:1/1}
.b-imgs.n3 img,.b-imgs.n4 img,.b-imgs.nx img{aspect-ratio:1/1}
.b-imgs .more{
  position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;display:grid;place-items:center;
}
.b-imgs .more img{position:absolute;inset:0;width:100%;height:100%}
.b-imgs .more span{
  position:relative;z-index:1;color:#fff;font-weight:700;font-size:16px;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.b-imgs .more::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.b-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagpill{
  font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:7px;letter-spacing:-.01em;
}
html[data-theme="dark"] .tagpill{color:var(--accent-deep)}
.b-foot{display:flex;align-items:center;gap:6px;margin-top:2px;padding-top:2px;min-height:16px}
.b-time{font-size:10.5px;color:var(--sub);letter-spacing:-.01em}
.b-fold{font-size:10.5px;color:var(--sub);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:nowrap}
.b-pin{font-size:10px}
.b-more{
  margin-left:auto;width:22px;height:20px;border-radius:6px;display:grid;place-items:center;
  color:var(--sub);opacity:.55;
}
.b-more:active{background:var(--line);opacity:1}

/* 빈 상태 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 20px 10px;gap:4px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty .e-emoji{
  width:76px;height:76px;border-radius:26px;display:grid;place-items:center;font-size:34px;
  background:linear-gradient(160deg,var(--surface),var(--accent-soft));
  box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line);
}
.empty h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}
.empty p{margin:6px 0 0;font-size:13.5px;line-height:1.65;color:var(--sub);white-space:pre-line}
.empty .e-cta{
  margin-top:18px;height:40px;padding:0 18px;border-radius:13px;font-size:13.5px;font-weight:700;
  background:var(--chip-on-bg);color:var(--chip-on-ink);box-shadow:0 6px 16px rgba(110,66,34,.22)
}
.tips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.tips span{font-size:11.5px;color:var(--sub);border:1px dashed var(--line-2);border-radius:999px;padding:4px 10px}

/* ---------- 입력창 ---------- */
.composer{
  position:relative;z-index:3;flex:0 0 auto;
  padding:6px 12px calc(8px + env(safe-area-inset-bottom)*0);
  background:linear-gradient(to bottom,rgba(248,242,229,0),var(--bg) 26%);
  border-top:1px solid transparent;
}
html[data-theme="dark"] .composer{background:linear-gradient(to bottom,rgba(20,17,14,0),var(--bg) 26%)}
.tagtoggle{
  display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 11px;margin:0 0 7px 2px;
  border-radius:999px;font-size:11.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border:1px solid rgba(176,114,63,.18);transition:all .18s;
}
.tagtoggle .sp{font-size:11px}
.tagtoggle.on{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:transparent}
.tagpanel{
  display:grid;gap:6px;overflow:hidden;max-height:0;opacity:0;transition:max-height .26s ease,opacity .2s ease,margin .2s;
}
.tagpanel.on{max-height:120px;opacity:1;margin-bottom:7px}
.tagpanel input{
  height:38px;border-radius:11px;background:rgba(255,253,247,.8);border:1px solid var(--line-2);
  padding:0 12px;font-size:16px;color:var(--ink);
}
html[data-theme="dark"] .tagpanel input{background:rgba(34,28,22,.8)}
.tagpanel input:focus{border-color:var(--accent);background:var(--surface)}
.attachrow{display:flex;gap:7px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.attachrow::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);box-shadow:var(--shadow-sm)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{
  position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(25,20,15,.72);color:#fff;display:grid;place-items:center;font-size:11px;line-height:1;
}
.ctarget{font-size:10.5px;color:var(--sub);text-align:right;padding:0 6px 5px;letter-spacing:-.01em}
.crow{display:flex;align-items:flex-end;gap:7px}
.cbtn{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-2);background:rgba(255,253,247,.9);border:1px solid var(--line-2);transition:transform .14s,background .14s;
}
html[data-theme="dark"] .cbtn{background:rgba(34,28,22,.9)}
.cbtn:active{transform:scale(.9);background:var(--accent-soft)}
.cfield{
  flex:1;min-width:0;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line-2);border-radius:21px;
  padding:8px 14px;min-height:40px;box-shadow:var(--shadow-sm);transition:border-color .16s;
}
.cfield:focus-within{border-color:rgba(176,114,63,.55)}
.cfield textarea{
  width:100%;resize:none;border:none;font-size:16px;line-height:1.45;max-height:126px;
  overflow-y:auto;padding:1px 0;letter-spacing:-.01em;
}
.sendbtn{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--line);color:var(--sub);transition:all .18s;border:1px solid transparent;
}
.sendbtn.on{
  background:linear-gradient(150deg,#B97B45,#8C5228);color:#FFF6E6;
  box-shadow:0 5px 14px rgba(140,82,40,.34);transform:none;
}
html[data-theme="dark"] .sendbtn.on{background:linear-gradient(150deg,#E7B184,#C68A57);color:#2A1C10}
.sendbtn.on:active{transform:scale(.92)}

/* ---------- 탭바 ---------- */
.tabbar{
  position:relative;z-index:5;flex:0 0 auto;display:flex;
  padding:5px 10px calc(5px + env(safe-area-inset-bottom));
  background:rgba(250,245,233,.92);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
html[data-theme="dark"] .tabbar{background:rgba(22,18,14,.92)}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 0 3px;border-radius:14px;color:var(--sub);font-size:10.5px;font-weight:600;letter-spacing:-.01em;
  transition:color .16s,transform .16s;
}
.tab svg{width:23px;height:23px;transition:transform .2s}
.tab.on{color:var(--accent-deep)}
html[data-theme="dark"] .tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-1px)}
.tab:active{transform:scale(.94)}

/* ---------- 캘린더 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;max-width:760px;margin:0 auto;width:100%}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-title{font-size:17px;font-weight:700;letter-spacing:-.03em;padding:0 4px}
.cal-today{font-size:12px;font-weight:600;color:var(--accent);padding:5px 9px;border-radius:9px;background:var(--accent-soft)}
.cal-scope{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 2px;scrollbar-width:none;max-width:760px;margin:0 auto;width:100%}
.cal-scope::-webkit-scrollbar{display:none}
.cal-scope .chip{height:27px;font-size:11.5px;padding:0 10px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 10px 2px;max-width:760px;margin:0 auto;width:100%}
.cal-dow div{text-align:center;font-size:11px;font-weight:600;color:var(--sub);padding:4px 0}
.cal-dow .sun{color:#C1614B}
.cal-dow .sat{color:#5C7BA6}
html[data-theme="dark"] .cal-dow .sun{color:#E08A72}
html[data-theme="dark"] .cal-dow .sat{color:#8FADD4}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 8px 8px;
  max-width:760px;margin:0 auto;width:100%;
}
.day{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 0 5px;border-radius:13px;min-height:47px;
  font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background .16s,color .16s;
}
.day:active{background:var(--line)}
.day.other{opacity:.32}
.day.has{background:rgba(176,114,63,.07)}
html[data-theme="dark"] .day.has{background:rgba(216,154,100,.10)}
.day.today{color:var(--accent);font-weight:800}
.day.sel{background:var(--chip-on-bg);color:var(--chip-on-ink)!important;font-weight:800;box-shadow:0 4px 12px rgba(110,66,34,.22)}
.day .dots{display:flex;gap:2px;height:4px;align-items:center}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.75}
.day.sel .dot{background:var(--chip-on-ink);opacity:.9}
.day .num{line-height:1.2}
.day .cnt{
  position:absolute;top:2px;right:4px;font-size:8.5px;font-weight:700;color:var(--accent);opacity:.85;
}
.day.sel .cnt{color:var(--chip-on-ink)}
.daylist-head{
  display:flex;align-items:baseline;gap:7px;padding:14px 4px 10px;margin-top:4px;
  border-top:1px solid var(--line);
}
.daylist-head b{font-size:14px;font-weight:700;letter-spacing:-.02em}
.daylist-head span{font-size:11.5px;color:var(--sub)}
.dayempty{padding:26px 0 10px;text-align:center;color:var(--sub);font-size:12.5px}

/* ---------- 검색 ---------- */
.searchbar{
  display:flex;align-items:center;gap:8px;margin:8px 14px 4px;padding:0 12px;height:44px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:15px;box-shadow:var(--shadow-sm);
  max-width:732px;
}
@media(min-width:760px){.searchbar{margin-left:auto;margin-right:auto;width:calc(100% - 28px)}}
.searchbar svg{flex:0 0 auto;color:var(--sub)}
.searchbar input{flex:1;min-width:0;font-size:16px;letter-spacing:-.01em}
.searchbar input::-webkit-search-cancel-button{display:none}
.qclear{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink-2);display:grid;place-items:center;font-size:12px}
.s-filters{padding:8px 14px 2px;max-width:760px;margin:0 auto;width:100%}
.f-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.f-row::-webkit-scrollbar{display:none}
.f-row .chip{height:28px;font-size:11.5px;padding:0 10px}
.f-label{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.02em;margin:2px 0 5px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:4px}
.tagbtn{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.tagbtn.on{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:transparent}
.res-head{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 8px;font-size:11.5px;color:var(--sub);font-weight:600}
.card{
  display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow-sm);
  transition:transform .14s, border-color .14s;
}
.card:active{transform:scale(.985);border-color:var(--line-2)}
.card .c-top{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);margin-bottom:3px}
.card .c-fold{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.card .c-title{font-size:14px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.card .c-text{font-size:13px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.card .c-text mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.card .c-thumbs{display:flex;gap:4px;margin-top:7px}
.card .c-thumbs img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.card .c-thumbs .plus{width:46px;height:46px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--sub);border:1px solid var(--line)}
.card .c-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photogrid button{position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:var(--surface-2)}
.photogrid img{width:100%;height:100%;object-fit:cover}
.photogrid .pd{position:absolute;left:0;right:0;bottom:0;font-size:9px;color:#fff;padding:8px 5px 3px;background:linear-gradient(to top,rgba(0,0,0,.5),transparent);text-align:left}

/* ---------- 모달/시트 ---------- */
.m-backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(38,28,19,.34);
  opacity:0;transition:opacity .22s ease;display:flex;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.m-backdrop.show{opacity:1}
.m-sheet{
  width:100%;max-width:560px;max-height:88%;background:var(--surface);
  border-radius:24px 24px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.9,.28,1);
  box-shadow:0 -10px 40px rgba(30,20,12,.22);display:flex;flex-direction:column;overflow:hidden;
}
.m-backdrop.show .m-sheet{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 6px;flex:0 0 auto}
.sheet-title{font-size:13px;font-weight:700;color:var(--sub);padding:4px 20px 8px;letter-spacing:.01em;flex:0 0 auto}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px}
.act{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:13px 12px;border-radius:13px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--ink);
}
.act:active{background:var(--surface-2)}
.act .ai{width:22px;text-align:center;font-size:16px}
.act.danger{color:var(--danger)}
.sheet-sep{height:1px;background:var(--line);margin:5px 14px}
.sheet-cancel{
  margin:6px 10px 0;padding:13px;text-align:center;border-radius:14px;background:var(--surface-2);
  font-size:14.5px;font-weight:700;color:var(--ink-2);
}
.m-backdrop.center{align-items:center}
.m-backdrop.center .m-sheet{
  max-width:340px;border-radius:20px;padding:20px 18px calc(18px + env(safe-area-inset-bottom)*0);
  transform:translateY(14px) scale(.96);max-height:82%;
}
.m-backdrop.center.show .m-sheet{transform:none}
.dlg-title{font-size:16px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px}
.dlg-desc{font-size:12.5px;color:var(--sub);line-height:1.55;margin:0 0 12px;white-space:pre-line}
.dlg-input{
  width:100%;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);
  padding:0 12px;font-size:16px;margin-bottom:12px;
}
.dlg-input:focus{border-color:var(--accent);background:var(--surface)}
.dlg-btns{display:flex;flex-direction:column;gap:7px}
.dlg-btns.row{flex-direction:row}
.btn{
  flex:1;height:45px;border-radius:13px;font-size:14.5px;font-weight:700;letter-spacing:-.02em;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:transparent;box-shadow:0 6px 16px rgba(110,66,34,.2)}
.btn.danger{color:var(--danger);border-color:rgba(188,81,56,.25)}
.btn.ghost{background:transparent}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 4px 10px}
.emoji-grid button{aspect-ratio:1/1;border-radius:11px;font-size:21px;display:grid;place-items:center;background:var(--surface-2);border:1px solid transparent}
.emoji-grid button:active,.emoji-grid button.on{border-color:var(--accent);background:var(--accent-soft)}
html[data-theme="dark"] .emoji-grid button{background:#2A221A}

/* 전체화면 편집기 */
.m-full{
  position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.22,.9,.28,1);
}
.m-full.show{transform:none}
.mf-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);
  background:var(--bg);flex:0 0 auto;
}
.mf-head b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.mf-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 30px;max-width:760px;margin:0 auto;width:100%}
.mf-label{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:14px 2px 6px;text-transform:uppercase}
.mf-title{width:100%;font-size:18px;font-weight:700;letter-spacing:-.03em;padding:8px 2px}
.mf-text{
  width:100%;min-height:150px;font-size:16px;line-height:1.6;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;resize:vertical;
}
.mf-input{
  width:100%;height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  padding:0 12px;font-size:16px;
}
.mf-input:focus,.mf-text:focus{border-color:var(--accent)}
.mf-photos{display:flex;gap:7px;flex-wrap:wrap}
.mf-add{
  width:64px;height:64px;border-radius:12px;border:1px dashed var(--line-2);color:var(--sub);
  display:grid;place-items:center;font-size:20px;background:var(--surface-2);
}
.mf-thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mf-thumb img{width:100%;height:100%;object-fit:cover}
.mf-thumb .rm{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;background:rgba(25,20,15,.72);color:#fff;display:grid;place-items:center;font-size:11px}
.mf-save{font-size:14px;font-weight:700;color:var(--accent);padding:8px 12px;border-radius:10px;background:var(--accent-soft)}
.mf-cancel{font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 10px}
.mf-del{width:100%;margin-top:26px;padding:13px;border-radius:13px;color:var(--danger);font-size:13.5px;font-weight:600;background:rgba(188,81,56,.07);border:1px solid rgba(188,81,56,.18)}

/* 라이트박스 */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(12,9,6,.95);display:flex;flex-direction:column;opacity:0;transition:opacity .2s}
.lightbox.show{opacity:1}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px;flex:0 0 auto}
.lb-top button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lb-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;overflow:hidden}
.lb-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-foot{padding:10px 20px calc(18px + env(safe-area-inset-bottom));color:rgba(255,255,255,.7);font-size:12px;text-align:center;flex:0 0 auto}
.lb-count{color:#fff;font-weight:700;font-size:13px;padding:0 12px}
.lb-nav{display:flex;align-items:center;justify-content:space-between;flex:1;padding:0 6px;color:#fff}

/* 설정 */
.set-row{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:13px;font-size:14.5px;font-weight:600}
.set-row:active{background:var(--surface-2)}
.set-row .si{width:24px;text-align:center;font-size:16px}
.set-row .chev{margin-left:auto;color:var(--sub);font-size:15px}
.set-row .sw{margin-left:auto;flex:0 0 auto}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,1.2,.5,1)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.storage{margin:8px 12px;padding:11px 13px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.storage .s-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:6px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C99257,#A3642F);transition:width .3s}
.set-foot{text-align:center;font-size:10.5px;color:var(--sub);line-height:1.7;padding:14px 10px 4px;opacity:.85}

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:90;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;max-width:88vw;
  background:rgba(44,33,23,.94);color:#FFF6E8;font-size:13px;font-weight:600;letter-spacing:-.01em;
  padding:10px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);
  transition:opacity .22s,transform .22s;backdrop-filter:blur(8px);
}
html[data-theme="dark"] .toast{background:rgba(245,236,224,.95);color:#241A11}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#FFD9A8;font-weight:800;font-size:12.5px;white-space:nowrap;padding:2px 0 2px 4px}
html[data-theme="dark"] .toast button{color:#8C5228}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================
   1. 기본 유틸
============================================================ */
var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad2 = function(n){return (n<10?'0':'')+n};
var WD = ['일','월','화','수','목','금','토'];
var uid = function(p){return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7)};
var esc = function(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function fmtDate(ts){var d=new Date(ts);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'}
function fmtTime(ts){
  var d=new Date(ts), h=d.getHours(), m=pad2(d.getMinutes());
  var ap = h<12?'오전':'오후';
  h = h%12; if(h===0) h=12;
  return ap+' '+h+':'+m;
}
function fmtShort(ts){var d=new Date(ts);return (d.getMonth()+1)+'.'+d.getDate()+' '+fmtTime(ts)}
function todayKey(){return dayKey(Date.now())}
function parseTags(str){
  if(!str) return [];
  var out=[];
  str.split(/[\s,]+/).forEach(function(t){
    t=t.replace(/^#+/,'').trim();
    if(t && out.indexOf(t)<0 && out.length<8) out.push(t);
  });
  return out;
}
function hashCode(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}
var ICON = {
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chevL:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>',
  chevR:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>',
  dots:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>'
};

/* ============================================================
   2. 데이터
============================================================ */
var KEY='heeya-memo.v1';
var DEFAULT_FOLDERS=[
  {id:'f_basic',name:'기본 메모',icon:'📝'},
  {id:'f_cast',name:'방송·방셀',icon:'📺'},
  {id:'f_shop',name:'위시·쇼핑',icon:'🛍️'},
  {id:'f_money',name:'영수증·정산',icon:'🧾'}
];
function freshState(){
  return {
    v:1, title:'나와의 메모',
    folders: DEFAULT_FOLDERS.map(function(f){return {id:f.id,name:f.name,icon:f.icon}}),
    notes: [],
    settings: {theme:'light', folder:'all'}
  };
}
var state = freshState();
var saveWarned = false;

function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(!d || !Array.isArray(d.folders) || !Array.isArray(d.notes)) return;
    state = {
      v:1,
      title: d.title || '나와의 메모',
      folders: d.folders.filter(function(f){return f && f.id && f.name}),
      notes: d.notes.filter(function(n){return n && n.id && n.createdAt}).map(function(n){
        return {
          id:n.id, folderId:n.folderId||'f_basic', title:n.title||'', text:n.text||'',
          tags:Array.isArray(n.tags)?n.tags:[], images:Array.isArray(n.images)?n.images:[],
          createdAt:n.createdAt, updatedAt:n.updatedAt||n.createdAt, pinned:!!n.pinned
        };
      }),
      settings: Object.assign({theme:'light',folder:'all'}, d.settings||{})
    };
    if(!state.folders.length) state.folders = DEFAULT_FOLDERS.map(function(f){return {id:f.id,name:f.name,icon:f.icon}});
  }catch(e){ console.warn('load failed', e); }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(e){
    if(!saveWarned){
      saveWarned = true;
      toast('저장 공간이 가득 찼어요. 설정에서 백업 후 사진을 줄여 주세요.', {icon:'⚠️', duration:4600});
      setTimeout(function(){saveWarned=false}, 15000);
    }
  }
}
function folderById(id){
  for(var i=0;i<state.folders.length;i++) if(state.folders[i].id===id) return state.folders[i];
  return null;
}
function defaultFolderId(){ return state.folders[0] ? state.folders[0].id : 'f_basic'; }
function folderLabel(note){
  var f = folderById(note.folderId);
  return f ? (f.icon+' '+f.name) : '📁 폴더';
}
function notesAll(){ return state.notes.slice(); }
function notesIn(folderId){
  if(folderId==='all') return state.notes.slice();
  return state.notes.filter(function(n){return n.folderId===folderId});
}
function sortedAsc(arr){ return arr.slice().sort(function(a,b){return a.createdAt-b.createdAt}) }
function sortedDesc(arr){ return arr.slice().sort(function(b,a){return a.createdAt-b.createdAt}) }
function noteById(id){
  for(var i=0;i<state.notes.length;i++) if(state.notes[i].id===id) return state.notes[i];
  return null;
}
function previewOf(n){
  var t=(n.text||'').replace(/\s+/g,' ').trim();
  if(t) return t;
  if(n.title) return n.title;
  if(n.images && n.images.length) return '사진 ' + n.images.length + '장';
  return '빈 메모';
}

/* UI 상태 */
var ui = {
  tab:'memo',
  folder:'all',
  cal:{ y:0, m:0, selected:null, scope:'all' },
  search:{ q:'', tag:null, photos:false, folder:'all' },
  editing:null,
  pendingImages: []
};
(function initUI(){
  var d = new Date();
  ui.cal.y = d.getFullYear();
  ui.cal.m = d.getMonth();
  ui.cal.selected = todayKey();
})();

/* ============================================================
   3. 공통 UI — 토스트 / 시트 / 다이얼로그
============================================================ */
var toastEl=null, toastTimer=null;
function toast(msg,opt){
  opt = opt || {};
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className='toast';
    document.body.appendChild(toastEl);
  }
  toastEl.innerHTML='';
  var ic=document.createElement('span');
  ic.textContent = opt.icon || '';
  if(opt.icon) toastEl.appendChild(ic);
  var tx=document.createElement('span');
  tx.textContent = msg;
  toastEl.appendChild(tx);
  if(opt.action){
    var b=document.createElement('button');
    b.textContent=opt.action;
    b.addEventListener('click',function(){
      hideToast();
      if(opt.onAction) opt.onAction();
    });
    toastEl.appendChild(b);
  }
  clearTimeout(toastTimer);
  requestAnimationFrame(function(){ toastEl.classList.add('show') });
  toastTimer=setTimeout(hideToast, opt.duration || 2300);
}
function hideToast(){
  if(!toastEl) return;
  toastEl.classList.remove('show');
}

var layers = [];
function openLayer(kind){
  var bd=document.createElement('div');
  bd.className='m-backdrop'+(kind==='center'?' center':'');
  var sheet=document.createElement('div');
  sheet.className='m-sheet';
  bd.appendChild(sheet);
  document.body.appendChild(bd);
  void bd.offsetHeight;
  bd.classList.add('show');
  var closed=false;
  var obj={
    bd:bd, sheet:sheet,
    close:function(){
      if(closed) return;
      closed=true;
      bd.classList.remove('show');
      setTimeout(function(){ if(bd.parentNode) bd.parentNode.removeChild(bd) },280);
      var i=layers.indexOf(obj); if(i>=0) layers.splice(i,1);
    }
  };
  bd.addEventListener('click',function(e){ if(e.target===bd) obj.close() });
  layers.push(obj);
  return obj;
}
function closeTopLayer(){
  if(!layers.length) return false;
  layers[layers.length-1].close();
  return true;
}

function sheetTitle(text){
  var g=document.createElement('div'); g.className='sheet-grab'; 
  var t=document.createElement('div'); t.className='sheet-title'; t.textContent=text;
  return [g,t];
}
function showActions(title, items){
  var L=openLayer('sheet');
  sheetTitle(title).forEach(function(n){L.sheet.appendChild(n)});
  var body=document.createElement('div'); body.className='sheet-body';
  items.forEach(function(it){
    if(it.sep){ var s=document.createElement('div'); s.className='sheet-sep'; body.appendChild(s); return; }
    var b=document.createElement('button');
    b.className='act'+(it.danger?' danger':'');
    var i=document.createElement('span'); i.className='ai'; i.textContent=it.icon||'';
    var l=document.createElement('span'); l.textContent=it.label;
    b.appendChild(i); b.appendChild(l);
    b.addEventListener('click',function(){ L.close(); setTimeout(function(){ if(it.fn) it.fn() }, 40) });
    body.appendChild(b);
  });
  L.sheet.appendChild(body);
  var c=document.createElement('button'); c.className='sheet-cancel'; c.textContent='닫기';
  c.addEventListener('click',function(){L.close()});
  L.sheet.appendChild(c);
  return L;
}
function dialog(opts){
  /* opts: title, desc, input, placeholder, value, buttons:[{label,value,cls}] */
  return new Promise(function(resolve){
    var L=openLayer('center');
    var t=document.createElement('div'); t.className='dlg-title'; t.textContent=opts.title;
    L.sheet.appendChild(t);
    if(opts.desc){
      var d=document.createElement('div'); d.className='dlg-desc'; d.textContent=opts.desc;
      L.sheet.appendChild(d);
    }
    var input=null;
    if(opts.input){
      input=document.createElement('input');
      input.className='dlg-input';
      input.type='text';
      input.value=opts.value||'';
      input.placeholder=opts.placeholder||'';
      input.maxLength=40;
      L.sheet.appendChild(input);
    }
    var row=document.createElement('div');
    row.className='dlg-btns'+(opts.buttons && opts.buttons.length===2?' row':'');
    var done=false;
    function finish(v){ if(done) return; done=true; L.close(); resolve(v); }
    (opts.buttons||[{label:'확인',value:true,cls:'primary'}]).forEach(function(bt){
      var b=document.createElement('button');
      b.className='btn '+(bt.cls||'');
      b.textContent=bt.label;
      b.addEventListener('click',function(){
        finish(bt.returnsInput ? (input?input.value.trim():'') : bt.value);
      });
      row.appendChild(b);
    });
    L.sheet.appendChild(row);
    if(input){
      setTimeout(function(){ input.focus(); input.select(); }, 320);
      input.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          e.preventDefault();
          var primary=(opts.buttons||[]).filter(function(b){return b.cls==='primary'})[0];
          if(primary) finish(primary.returnsInput ? input.value.trim() : primary.value);
        }
      });
    }
  });
}

function deleteFolder(id){
  var f=folderById(id); if(!f) return;
  var cnt=notesIn(id).length;
  var fallback=state.folders.filter(function(x){return x.id!==id})[0];
  var desc = cnt ? ('이 폴더에 메모 '+cnt+'개가 있어요.\n메모를 다른 폴더로 옮기거나 함께 지울 수 있어요.') : '빈 폴더예요. 삭제할까요?';
  var L=openLayer('center');
  var t=document.createElement('div'); t.className='dlg-title'; t.textContent='‘'+f.name+'’ 폴더 삭제';
  var d=document.createElement('div'); d.className='dlg-desc'; d.textContent=desc;
  L.sheet.appendChild(t); L.sheet.appendChild(d);
  var box=document.createElement('div'); box.className='dlg-btns';
  var done=false;
  function close(){ if(done)return; done=true; setTimeout(function(){L.close()},60) }
  if(cnt && fallback){
    var b1=document.createElement('button');
    b1.className='btn primary';
    b1.textContent='메모를 ‘'+fallback.name+'(으)로 옮기고 삭제';
    b1.addEventListener('click',function(){
      state.notes.forEach(function(n){ if(n.folderId===id) n.folderId=fallback.id });
      removeFolder(); toast('메모를 옮기고 폴더를 지웠어요',{icon:'📁'});
    });
    box.appendChild(b1);
    var b2=document.createElement('button');
    b2.className='btn danger';
    b2.textContent='메모 '+cnt+'개까지 함께 삭제';
    b2.addEventListener('click',function(){
      state.notes=state.notes.filter(function(n){return n.folderId!==id});
      removeFolder(); toast('폴더와 메모를 지웠어요',{icon:'🗑️'});
    });
    box.appendChild(b2);
  } else {
    var b3=document.createElement('button');
    b3.className='btn danger';
    b3.textContent='폴더 삭제';
    b3.addEventListener('click',function(){ removeFolder(); toast('폴더를 지웠어요',{icon:'📁'}) });
    box.appendChild(b3);
  }
  var bc=document.createElement('button');
  bc.className='btn ghost'; bc.textContent='취소';
  bc.addEventListener('click',function(){L.close()});
  box.appendChild(bc);
  L.sheet.appendChild(box);

  function removeFolder(){
    close();
    state.folders=state.folders.filter(function(x){return x.id!==id});
    if(!state.folders.length){
      state.folders.push({id:'f_basic',name:'기본 메모',icon:'📝'});
    }
    if(ui.folder===id) ui.folder='all';
    save(); renderChips(); renderChat(); renderCal(); renderSearch(); updateComposerTarget();
    setTimeout(function(){ L.close() },80);
  }
}

function renderChat(){
  var body=$('#chatBody'); if(!body) return;
  var list=sortedAsc(notesIn(ui.folder));
  body.innerHTML='';

  if(!list.length){
    body.appendChild(emptyState());
    return;
  }

  var pinned=list.filter(function(n){return n.pinned});
  var normal=list.filter(function(n){return !n.pinned});

  if(pinned.length){
    var lab=document.createElement('div'); lab.className='sec-label'; lab.textContent='📌 고정된 메모';
    body.appendChild(lab);
    pinned.forEach(function(n){ body.appendChild(bubbleEl(n)) });
  }

  var lastDay=null;
  normal.forEach(function(n){
    var k=dayKey(n.createdAt);
    if(k!==lastDay){
      lastDay=k;
      body.appendChild(dateDivider(n.createdAt));
    }
    body.appendChild(bubbleEl(n));
  });

  if(!normal.length && pinned.length){
    var hint=document.createElement('div');
    hint.className='dayempty';
    hint.textContent='아래에 새 메모를 남겨 보세요';
    body.appendChild(hint);
  }
}

function dateDivider(ts){
  var d=document.createElement('div');
  d.className='date-div';
  var s=document.createElement('span');

  if(dayKey(ts)===todayKey()){

function bubbleEl(n){
  var wrap=document.createElement('div');
  wrap.className='row';
  wrap.dataset.nid=n.id;

  var b=document.createElement('div');
  b.className='bubble'+(n.pinned?' pinned':'');
  b.dataset.nid=n.id;

  /* 사진 */
  if(n.images && n.images.length){
    var grid=document.createElement('div');
    var k=n.images.length;
    grid.className='b-imgs '+(k===1?'n1':k===2?'n2':k===3?'n3':k===4?'n4':'nx');
    var visible = k>4 ? 4 : k;
    for(var ii=0; ii<visible; ii++){
      (function(idx){
        var im=document.createElement('img');
        im.src=n.images[idx]; im.alt='첨부 사진'; im.loading='lazy';
        im.addEventListener('click',function(e){ e.stopPropagation(); openLightbox(n,idx) });
        grid.appendChild(im);
      })(ii);
    }
    if(k>4){
      var m=document.createElement('div'); m.className='more';
      var img=document.createElement('img'); img.src=n.images[4]; img.alt='';
      var sp=document.createElement('span'); sp.textContent='+'+(k-4);
      m.appendChild(img); m.appendChild(sp);
      m.addEventListener('click',function(e){ e.stopPropagation(); openLightbox(n,4) });
      grid.appendChild(m);
    }
    b.appendChild(grid);
  }

  if(n.title){
    var ti=document.createElement('div'); ti.className='b-title'; ti.textContent=n.title;
    b.appendChild(ti);
  }
  if(n.text){
    var tx=document.createElement('div'); tx.className='b-text'; tx.textContent=n.text;
    b.appendChild(tx);
  }
  if(n.tags && n.tags.length){
    var tg=document.createElement('div'); tg.className='b-tags';
    n.tags.forEach(function(t){
      var s=document.createElement('span'); s.className='tagpill'; s.textContent='#'+t;
      tg.appendChild(s);
    });
    b.appendChild(tg);
  }

  var foot=document.createElement('div'); foot.className='b-foot';
  if(n.pinned){ var p=document.createElement('span'); p.className='b-pin'; p.textContent='📌'; foot.appendChild(p); }
  var time=document.createElement('span'); time.className='b-time'; time.textContent=fmtTime(n.createdAt);
  foot.appendChild(time);
  if(ui.folder==='all' || ui.tab!=='memo'){
    var fd=document.createElement('span'); fd.className='b-fold'; fd.textContent=folderLabel(n);
    foot.appendChild(fd);
  }
  var more=document.createElement('button');
  more.className='b-more'; more.innerHTML=ICON.dots; more.setAttribute('aria-label','메모 메뉴');
  more.addEventListener('click',function(e){ e.stopPropagation(); openNoteSheet(n.id) });
  foot.appendChild(more);
  b.appendChild(foot);

  /* 탭 / 길게 누르기 */
  var pressTimer=null, longFired=false;
  b.addEventListener('click',function(e){
    if(e.target.closest('button')) return;
    if(e.target.tagName==='IMG') return;
    if(longFired){ longFired=false; return; }
    openNoteSheet(n.id);
  });
  b.addEventListener('pointerdown',function(e){
    if(e.target.closest('button')||e.target.tagName==='IMG') return;
    longFired=false;
    pressTimer=setTimeout(function(){
      pressTimer=null; longFired=true;
      openNoteSheet(n.id);
    },460);
  });
  ['pointerup','pointercancel','pointerleave','pointermove'].forEach(function(ev){
    b.addEventListener(ev,function(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
    });
  });
  b.addEventListener('contextmenu',function(e){ e.preventDefault(); openNoteSheet(n.id) });

  wrap.appendChild(b);
  return wrap;
}

function openNoteSheet(id){
  var n=noteById(id); if(!n) return;
  var items=[];
  if(n.images && n.images.length) items.push({icon:'🖼️',label:'사진 크게 보기',fn:function(){ openLightbox(n,0) }});
  items.push({icon:'✏️',label:'수정하기',fn:function(){ openEditor(n) }});
  items.push({icon:'📋',label:'복사하기',fn:function(){ copyNote(n) }});
  items.push({icon:'📁',label:'다른 폴더로 이동',fn:function(){ moveNoteSheet(n) }});
  items.push({icon:n.pinned?'📍':'📌',label:n.pinned?'위 고정 해제':'위에 고정',fn:function(){ togglePin(n) }});
  items.push({sep:true});
  items.push({icon:'🗑️',label:'삭제하기',danger:true,fn:function(){ deleteNote(n) }});
  var t=n.title || previewOf(n).slice(0,22);
  showActions(t, items);
}
function copyNote(n){
  var lines=[];
  if(n.title) lines.push(n.title);
  if(n.text) lines.push(n.text);
  if(n.tags && n.tags.length) lines.push(n.tags.map(function(t){return '#'+t}).join(' '));
  var txt=lines.join('\n');
  function done(){ toast('메모를 복사했어요',{icon:'📋'}) }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ legacyCopy(txt); done(); });
  } else { legacyCopy(txt); done(); }
}
function legacyCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy') }catch(e){}
  document.body.removeChild(ta);
}
function moveNoteSheet(n){
  var items=state.folders.map(function(f){
    return {
      icon:(n.folderId===f.id?'✓':'')||f.icon,
      label:f.name,
      fn:function(){
        n.folderId=f.id; n.updatedAt=Date.now(); save();
        renderChat(); renderCal(); renderSearch(); renderAllChipsOnly();
        toast('‘'+f.name+'’ 폴더로 옮겼어요',{icon:f.icon});
      }
    };
  });

/* ---------- 라이트박스 ---------- */
function openLightbox(n,idx){
  var imgs=n.images||[]; if(!imgs.length) return;
  var cur=Math.max(0,Math.min(idx,imgs.length-1));
  var L=document.createElement('div'); L.className='lightbox';
  L.innerHTML='<div class="lb-top"><button class="lb-x">'+ICON.close+'</button></div>'+
              '<div class="lb-body"><img alt=""></div>'+
              '<div class="lb-foot"><div class="lb-cap"></div></div>';
  document.body.appendChild(L);
  void L.offsetHeight; L.classList.add('show');
  var img=L.querySelector('img');
  var cap=L.querySelector('.lb-cap');
  function paint(){
    img.src=imgs[cur];
    cap.innerHTML='';
    var c=document.createElement('div');
    c.textContent=fmtDate(n.createdAt)+' · '+(cur+1)+' / '+imgs.length;
    c.style.marginBottom='4px'; c.style.color='rgba(255,255,255,.55)';
    cap.appendChild(c);
    if(n.text){
      var t=document.createElement('div');
      t.textContent=n.text.length>90?n.text.slice(0,90)+'…':n.text;
      cap.appendChild(t);
    }
  }
  paint();
  function close(){ L.classList.remove('show'); setTimeout(function(){ if(L.parentNode) L.parentNode.removeChild(L) },220) }
  L.querySelector('.lb-x').addEventListener('click',close);
  L.addEventListener('click',function(e){ if(e.target===L||e.target.classList.contains('lb-body')) close(); });
  if(imgs.length>1){
    var nav=document.createElement('div');
    nav.className='lb-nav';
    var prev=document.createElement('button'); prev.innerHTML=ICON.chevL; prev.style.color='#fff';
    var cnt=document.createElement('span'); cnt.className='lb-count'; cnt.textContent=(cur+1)+' / '+imgs.length;
    var next=document.createElement('button'); next.innerHTML=ICON.chevR; next.style.color='#fff';
    prev.addEventListener('click',function(e){e.stopPropagation(); cur=(cur-1+imgs.length)%imgs.length; paint(); cnt.textContent=(cur+1)+' / '+imgs.length;});
    next.addEventListener('click',function(e){e.stopPropagation(); cur=(cur+1)%imgs.length; paint(); cnt.textContent=(cur+1)+' / '+imgs.length;});
    nav.appendChild(prev); nav.appendChild(cnt); nav.appendChild(next);
    L.querySelector('.lb-top').insertBefore(nav,L.querySelector('.lb-top').firstChild);
  }
  /* 스와이프 */
  var sx=0,sy=0;
  L.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  L.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy) && imgs.length>1){
      cur=(cur+(dx<0?1:-1)+imgs.length)%imgs.length; paint();
      var c2=L.querySelector('.lb-count'); if(c2) c2.textContent=(cur+1)+' / '+imgs.length;
    } else if(dy>90 && Math.abs(dy)>Math.abs(dx)){ close(); }
  },{passive:true});
}

function renderCal(){
  var y=ui.cal.y, m=ui.cal.m;
  $('#calTitle').textContent=y+'년 '+(m+1)+'월';

  /* 폴더 범위 칩 */
  var scope=$('#calScope'); scope.innerHTML='';
  function scopeChip(label,val){
    var c=document.createElement('button');
    c.className='chip'+(ui.cal.scope===val?' on':'');
    c.textContent=label;
    c.addEventListener('click',function(){ ui.cal.scope=val; renderCal(); });
    scope.appendChild(c);
  }
  scopeChip('전체 폴더','all');
  state.folders.forEach(function(f){ scopeChip(f.icon+' '+f.name, f.id) });
  if(ui.cal.scope!=='all' && !folderById(ui.cal.scope)) ui.cal.scope='all';

  var pool = ui.cal.scope==='all' ? state.notes.slice() : notesIn(ui.cal.scope);
  var counts={};
  pool.forEach(function(n){
    var k=dayKey(n.createdAt);
    counts[k]=(counts[k]||0)+1;
  });

  var first=new Date(y,m,1);
  var startDow=first.getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var prevDays=new Date(y,m,0).getDate();
  var grid=$('#calGrid'); grid.innerHTML='';

  var total=42;
  var today=todayKey();
  for(var i=0;i<total;i++){
    var dayNum, cls='day', mk;
    if(i<startDow){ dayNum=prevDays-startDow+i+1; cls+=' other'; mk=null; }
    else if(i>=startDow+daysInMonth){ dayNum=i-startDow-daysInMonth+1; cls+=' other'; mk=null; }
    else { dayNum=i-startDow+1; mk=y+'-'+pad2(m+1)+'-'+pad2(dayNum); }
    var cell=document.createElement('button');
    cell.className=cls;
    if(mk && counts[mk]) cell.classList.add('has');
    if(mk===today) cell.classList.add('today');
    if(mk && mk===ui.cal.selected) cell.classList.add('sel');
    var num=document.createElement('span'); num.className='num'; num.textContent=dayNum;
    cell.appendChild(num);
    var dots=document.createElement('div'); dots.className='dots';
    var c= mk? (counts[mk]||0) : 0;
    for(var d=0;d<Math.min(c,3);d++){
      var dot=document.createElement('i'); dot.className='dot'; dots.appendChild(dot);
    }
    if(c>0 && c<=3){ /* dots */ }
    if(c>3){ /* keep 3 dots + count */ }
    cell.appendChild(dots);
    if(c>0){
      var cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=c;
      if(c<=3) cnt.style.display='none';
      cell.appendChild(cnt);
    }
    if(mk){
      cell.addEventListener('click',function(key){
        return function(){
          ui.cal.selected=key;
          renderCal();
          setTimeout(function(){
            var list=$('#calList');
            if(list) list.scrollIntoView({behavior:'smooth',block:'start'});
          },30);
        };
      }(mk));
    }
    grid.appendChild(cell);
  }

  /* 선택한 날 목록 */
  var listEl=$('#calList'); listEl.innerHTML='';
  var sel=ui.cal.selected;
  var head=document.createElement('div'); head.className='daylist-head';
  var b=document.createElement('b');
  b.textContent = sel ? (Number(sel.slice(5,7))+'월 '+Number(sel.slice(8,10))+'일') : '';
  var wd = sel ? new Date(Number(sel.slice(0,4)),Number(sel.slice(5,7))-1,Number(sel.slice(8,10))).getDay() : 0;
  var sp=document.createElement('span');
  var selNotes = sel ? sortedAsc(pool.filter(function(n){return dayKey(n.createdAt)===sel})) : [];
  sp.textContent = '('+WD[wd]+') · '+selNotes.length+'개';
  head.appendChild(b); head.appendChild(sp);
  listEl.appendChild(head);

  if(!selNotes.length){
    var e=document.createElement('div'); e.className='dayempty';
    e.textContent='이 날은 메모가 없어요';
    listEl.appendChild(e);
  } else {
    selNotes.forEach(function(n){ listEl.appendChild(bubbleEl(n)) });
  }
}

function searchMatches(){
  var q=(ui.search.q||'').trim().toLowerCase();

    if(!q) return true;
    var hay=((n.title||'')+' '+(n.text||'')+' '+(n.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q)>=0;

function highlight(text,q){
  if(!q) return esc(text);
  var lower=text.toLowerCase();
  var out='', i=0, from=0;
  while(true){
    var at=lower.indexOf(q,i);
    if(at<0) break;
    out+=esc(text.slice(from,at));
    out+='<mark>'+esc(text.slice(at,at+q.length))+'</mark>';
    i=at+q.length; from=i;
    if(i>=text.length) break;
  }
  out+=esc(text.slice(from));
  return out;
}
function jumpToNote(id){
  var n=noteById(id); if(!n) return;
  ui.tab='memo';
  ui.folder = 'all';
  applyTab();
  renderChips(); renderChat(); updateComposerTarget();
  setTimeout(function(){ scrollToNote(id,true) },90);
}

/* ============================================================
   10. 사진
============================================================ */
var filePickTarget=null;
function pickImages(cb){
  filePickTarget=cb;
  var inp=$('#filePick');
  inp.value='';
  inp.click();
}
function fileToDataURL(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res(r.result)};
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
function loadImage(src){
  return new Promise(function(res,rej){
    var i=new Image();
    i.onload=function(){res(i)};
    i.onerror=rej;
    i.src=src;
  });
}
async function compressImage(file){
  var maxDim=1400, quality=0.72;
  var src=await fileToDataURL(file);
  if(src.indexOf('data:image/')!==0) throw new Error('not image');
  var img=await loadImage(src);
  var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  if(!w||!h) throw new Error('bad image');
  var scale=Math.min(1,maxDim/Math.max(w,h));
  w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  var out=c.toDataURL('image/jpeg',quality);
  /* 너무 크면 한 번 더 */
  var tries=0;
  while(out.length>560000 && tries<2){
    tries++;
    var c2=document.createElement('canvas');
    var s2=scale*(tries===1?0.75:0.6);
    c2.width=Math.max(1,Math.round((img.naturalWidth||w)*s2));
    c2.height=Math.max(1,Math.round((img.naturalHeight||h)*s2));
    var x2=c2.getContext('2d');
    x2.fillStyle='#ffffff'; x2.fillRect(0,0,c2.width,c2.height);
    x2.drawImage(img,0,0,c2.width,c2.height);
    out=c2.toDataURL('image/jpeg',tries===1?0.62:0.52);
  }
  return out;
}
async function handlePickedFiles(files){
  if(!files || !files.length) return;
  var list=Array.prototype.slice.call(files).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name||'')});
  if(!list.length){ toast('사진 파일이 아니에요',{icon:'🖼'}); return; }
  if(list.length>9){ list=list.slice(0,9); toast('사진은 최대 9장까지 붙일 수 있어요',{icon:'🖼'}); }
  toast('사진을 준비하고 있어요...',{icon:'⏳',duration:1400});
  var outs=[];
  for(var i=0;i<list.length;i++){
    try{
      var d=await compressImage(list[i]);
      outs.push(d);
    }catch(e){
      console.warn(e);
      toast('읽을 수 없는 사진이 있어요 (HEIC 등)',{icon:'⚠️',duration:3200});
    }
  }
  if(filePickTarget){ filePickTarget(outs); filePickTarget=null; }
  else {
    ui.pendingImages=ui.pendingImages.concat(outs).slice(0,9);
    renderAttachRow(); updateSendState();
  }
}

/* ============================================================
   11. 설정 / 백업
============================================================ */
function storageInfo(){
  var bytes=0;
  try{ bytes=new Blob([JSON.stringify(state)]).size }catch(e){ bytes=JSON.stringify(state).length*2 }
  var imgs=0;
  state.notes.forEach(function(n){ imgs+=(n.images||[]).length });
  return {bytes:bytes, imgs:imgs, notes:state.notes.length};
}
function fmtBytes(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/1024/1024).toFixed(1)+' MB';
}
function openSettings(){
  var L=openLayer('sheet');
  var g=document.createElement('div'); g.className='sheet-grab';
  var t=document.createElement('div'); t.className='sheet-title'; t.textContent='설정';
  L.sheet.appendChild(g); L.sheet.appendChild(t);
  var body=document.createElement('div'); body.className='sheet-body';

  /* 다크 모드 */
  var r1=document.createElement('div'); r1.className='set-row';
  r1.innerHTML='<span class="si">🌙</span><span>다크 모드</span>';
  var sw=document.createElement('button');
  sw.className='switch'+(state.settings.theme==='dark'?' on':'');
  sw.setAttribute('aria-label','다크 모드');
  sw.addEventListener('click',function(){
    var dark=state.settings.theme!=='dark';
    state.settings.theme=dark?'dark':'light';
    applyTheme(); save();
    sw.classList.toggle('on',dark);
  });
  r1.appendChild(sw);
  body.appendChild(r1);

  /* 홈 화면 추가 안내 */
  var r2=document.createElement('div'); r2.className='set-row';
  r2.innerHTML='<span class="si">📲</span><span>홈 화면에 추가하는 방법</span><span class="chev">›</span>';
  r2.addEventListener('click',function(){ L.close(); setTimeout(showInstallHelp,80) });
  body.appendChild(r2);

  var r3=document.createElement('div'); r3.className='set-row';
  r3.innerHTML='<span class="si">💾</span><span>백업 내보내기 (JSON)</span><span class="chev">›</span>';
  r3.addEventListener('click',function(){ exportJSON() });
  body.appendChild(r3);

  var r4=document.createElement('div'); r4.className='set-row';
  r4.innerHTML='<span class="si">📥</span><span>백업 가져오기</span><span class="chev">›</span>';
  r4.addEventListener('click',function(){ $('#jsonPick').value=''; $('#jsonPick').click(); });
  body.appendChild(r4);

  var info=storageInfo();
  var st=document.createElement('div'); st.className='storage';
  var pct=Math.max(1,Math.min(100, Math.round(info.bytes/(5*1024*1024)*100)));
  st.innerHTML='<div class="s-top"><span>저장 공간</span><span>'+fmtBytes(info.bytes)+' / 약 5 MB</span></div>'+
               '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  var sub=document.createElement('div');
  sub.style.cssText='font-size:10.5px;color:var(--sub);margin-top:6px;line-height:1.6';
  sub.textContent='메모 '+info.notes+'개 · 사진 '+info.imgs+'장 · 사진은 자동으로 압축돼요';
  st.appendChild(sub);
  body.appendChild(st);

  var r5=document.createElement('div'); r5.className='set-row';
  r5.style.color='var(--danger)';
  r5.innerHTML='<span class="si">🗑️</span><span>모든 메모 지우기</span>';
  r5.addEventListener('click',function(){
    L.close();
    setTimeout(function(){
      dialog({
        title:'정말 모두 지울까요?',
        desc:'메모 '+state.notes.length+'개와 사진이 모두 사라져요.\n지우기 전에 백업을 내보내 두는 걸 추천해요.',
        buttons:[{label:'취소',value:null,cls:'ghost'},{label:'모두 지우기',value:true,cls:'danger'}]
      }).then(function(v){
        if(!v) return;
        var theme=state.settings.theme;
        state=freshState();
        state.settings.theme=theme;
        ui.folder='all';
        save(); applyTheme(); renderAll();
        toast('모두 지웠어요',{icon:'🧹'});
      });
    },80);
  });
  body.appendChild(r5);

  var foot=document.createElement('div'); foot.className='set-foot';
  foot.innerHTML='나와의 메모 · v1.0<br>정희님 전용 메모 웹앱<br>데이터는 이 기기 브라우저에만 저장돼요';
  body.appendChild(foot);

  L.sheet.appendChild(body);
  var c=document.createElement('button'); c.className='sheet-cancel'; c.textContent='닫기';
  c.addEventListener('click',function(){L.close()});
  L.sheet.appendChild(c);
}
function showInstallHelp(){
  var L=openLayer('center');
  var t=document.createElement('div'); t.className='dlg-title'; t.textContent='홈 화면에 앱처럼 추가하기';
  var d=document.createElement('div'); d.className='dlg-desc';
  d.style.whiteSpace='pre-line';
  d.textContent='아이폰 사파리에서\n\n1. 아래 공유 버튼(□↑)을 눌러요\n2. ‘홈 화면에 추가’를 골라요\n3. 이름을 ‘나의 메모’로 저장\n\n그럼 진짜 앱처럼 아이콘으로 열려요 🌰';
  L.sheet.appendChild(t); L.sheet.appendChild(d);
  var b=document.createElement('button'); b.className='btn primary'; b.textContent='확인';
  b.addEventListener('click',function(){L.close()});
  L.sheet.appendChild(b);
}
function exportJSON(){
  var payload={app:'heeya-memo',version:1,exportedAt:new Date().toISOString(),data:state};
  try{
    var blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='나와의메모-백업-'+todayKey()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},15000);
    toast('백업 파일을 내보냈어요',{icon:'💾'});
  }catch(e){
    toast('백업 파일을 만들지 못했어요',{icon:'⚠️'});
  }
}
function importJSON(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var parsed=JSON.parse(r.result);
      var data=parsed && parsed.data ? parsed.data : parsed;
      if(!data || !Array.isArray(data.folders) || !Array.isArray(data.notes)) throw new Error('bad');
      var nc=data.notes.length, fc=data.folders.length;
      dialog({
        title:'백업을 가져올까요?',
        desc:'백업 파일에 메모 '+nc+'개, 폴더 '+fc+'개가 있어요.\n지금 있는 메모('+state.notes.length+'개)는 백업 내용으로 바뀝니다.',
        buttons:[{label:'취소',value:null,cls:'ghost'},{label:'가져오기',value:true,cls:'primary'}]
      }).then(function(v){
        if(!v) return;
        var theme=state.settings.theme;
        state={
          v:1, title:data.title||'나와의 메모',
          folders:data.folders.map(function(f){return {id:f.id,name:f.name,icon:f.icon||'📁'}}),
          notes:data.notes.map(function(n){
            return {
              id:n.id||uid('n_'), folderId:n.folderId||'f_basic', title:n.title||'', text:n.text||'',
              tags:Array.isArray(n.tags)?n.tags:[], images:Array.isArray(n.images)?n.images:[],
              createdAt:n.createdAt||Date.now(), updatedAt:n.updatedAt||n.createdAt||Date.now(), pinned:!!n.pinned
            };
          }),
          settings:Object.assign({}, state.settings, data.settings||{})
        };
        if(!state.folders.length) state.folders=DEFAULT_FOLDERS.map(function(f){return {id:f.id,name:f.name,icon:f.icon}});
        state.settings.theme=theme;
        if(ui.folder!=='all' && !folderById(ui.folder)) ui.folder='all';
        save(); applyTheme(); renderAll();
        toast('백업을 가져왔어요 · 메모 '+nc+'개',{icon:'📥'});
      });
    }catch(e){
      toast('백업 파일을 읽을 수 없어요',{icon:'⚠️'});
    }
  };
  r.readAsText(file);
}

/* ============================================================
   12. 테마 / 탭 / 초기화
============================================================ */
function applyTheme(){
  var t=state.settings.theme==='dark'?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t==='dark'?'#14110E':'#F8F2E6');
}
function applyTab(){
  $$('.tab').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab===ui.tab);
  });
  $('#view-memo').hidden = ui.tab!=='memo';
  $('#view-cal').hidden = ui.tab!=='cal';
  $('#view-search').hidden = ui.tab!=='search';
  $('#chips').classList.toggle('off', ui.tab!=='memo');
  if(ui.tab==='memo'){ renderChat(); updateComposerTarget(); setTimeout(function(){scrollChatToBottom(false)},20); }
  if(ui.tab==='cal'){ renderCal(); }
  if(ui.tab==='search'){ renderSearch(); }
}
function renderAll(){
  renderChips();
  if(ui.tab==='memo'){ renderChat(); updateComposerTarget(); }
  if(ui.tab==='cal') renderCal();
  if(ui.tab==='search') renderSearch();
  else renderSearchFilters();
}

/* 키보드 대응 */
function fitViewport(){
  var vv=window.visualViewport;
  var h=Math.round(vv?vv.height:window.innerHeight);
  var top=vv?Math.max(0,Math.round(vv.offsetTop)):0;
  document.documentElement.style.setProperty('--app-h',h+'px');
  document.documentElement.style.setProperty('--app-top',top+'px');
}

/* ============================================================
   13. 이벤트 연결
============================================================ */
var inited=false;
function init(){
  if(inited) return;
  inited=true;
  loadState();
  if(state.settings.folder && (state.settings.folder==='all' || folderById(state.settings.folder))){
    ui.folder=state.settings.folder;
  }
  applyTheme();
  applyTab();
  renderChips();
  renderChat();
  updateComposerTarget();
  updateSendState();

  $('#btnFolders').addEventListener('click',openDrawer);
  $('#btnSettings').addEventListener('click',openSettings);

  $$('.tab').forEach(function(b){
    b.addEventListener('click',function(){
      ui.tab=b.dataset.tab;
      applyTab();
    });
  });

  /* 입력 */
  var ta=$('#inText');
  ta.addEventListener('input',function(){ autoGrow(ta); updateSendState(); });
  ta.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); sendMemo(); }
  });
  $('#inTitle').addEventListener('input',updateSendState);
  $('#btnSend').addEventListener('click',sendMemo);
  $('#btnPhoto').addEventListener('click',function(){
    filePickTarget=null;
    $('#filePick').value='';
    $('#filePick').click();
  });

  $('#tagToggle').addEventListener('click',function(){
    var on=$('#tagPanel').classList.toggle('on');
    $('#tagToggle').classList.toggle('on',on);
    $('#tagToggle').innerHTML = on
      ? '<span class="sp">✨</span> 제목·태그 접기'
      : '<span class="sp">✨</span> 제목·태그 붙여서 쓰기';
    if(on) setTimeout(function(){ $('#inTitle').focus() },220);
  });

  $('#filePick').addEventListener('change',function(e){
    var files=e.target.files;
    handlePickedFiles(files);
  });

  $('#jsonPick').addEventListener('change',function(e){
    var f=e.target.files && e.target.files[0];
    if(f) importJSON(f);
  });

  /* 캘린더 */
  $('#calPrev').addEventListener('click',function(){
    ui.cal.m--; if(ui.cal.m<0){ui.cal.m=11;ui.cal.y--} renderCal();
  });
  $('#calNext').addEventListener('click',function(){
    ui.cal.m++; if(ui.cal.m>11){ui.cal.m=0;ui.cal.y++} renderCal();
  });
  $('#calToday').addEventListener('click',function(){
    var d=new Date(); ui.cal.y=d.getFullYear(); ui.cal.m=d.getMonth();
    ui.cal.selected=todayKey(); renderCal();
    var list=$('#calList'); if(list) list.scrollIntoView({behavior:'smooth',block:'start'});
  });

  /* 검색 */
  var qi=$('#qInput');
  var qTimer=null;
  qi.addEventListener('input',function(){
    ui.search.q=qi.value;
    $('#qClear').hidden=!qi.value;
    clearTimeout(qTimer);
    qTimer=setTimeout(renderSearchResults,120);
  });
  $('#qClear').addEventListener('click',function(){
    qi.value=''; ui.search.q=''; $('#qClear').hidden=true; renderSearchResults(); qi.focus();
  });

  /* 뷰포트 */
  fitViewport();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',fitViewport);
    window.visualViewport.addEventListener('scroll',fitViewport);
  }
  window.addEventListener('resize',fitViewport);
  window.addEventListener('orientationchange',function(){ setTimeout(fitViewport,250) });

  /* 스크롤 시 입력창 blur? (아니오) */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      var lb=document.querySelector('.lightbox');
      if(lb){ lb.remove(); return; }
      var full=document.querySelector('.m-full');
      if(full){ full.remove(); return; }
      closeTopLayer();
    }
  });

  /* 첫 실행 시 폴더 안내 */
  if(!state.notes.length){
    setTimeout(function(){ scrollChatToBottom(false) },50);
  }
}

window.addEventListener('error',function(e){
  console.error('app error', e.message);
});

document.addEventListener('DOMContentLoaded',init);
if(document.readyState!=='loading') init();
})();
